<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Броня Крепка — Новая тема</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="headerPlaceholder"></div>

<div class="page-layout">
  <main class="main-content" style="max-width:800px;margin:0 auto">

    <div class="breadcrumbs">
      <a href="feed.html">Форум</a> <span>/</span>
      <span>Новая тема</span>
    </div>

    <h1 style="font-size:1.3rem;font-weight:800;margin-bottom:1rem">➕ Создать новую тему</h1>

    <form class="sidebar-widget" style="padding:1.5rem" onsubmit="window.location.href='feed.html';return false" data-draft="new-topic">

      <div class="form-group">
        <label for="topicTitle">Заголовок темы</label>
        <input class="input" type="text" id="topicTitle" placeholder="Например: Разбор реплея на E 50 M" data-draft-field="title">
      </div>

      <div class="form-group">
        <label for="topicCategory">Категория</label>
        <select class="input" id="topicCategory" data-draft-field="category">
          <option>Ламповая броня (общий чат)</option>
          <option selected>Тактический полигон (реплеи, гайды)</option>
          <option>Склад нытья и поддержки</option>
          <option>Курилка механика-водителя (офтоп)</option>
          <option>Архив легенд (байки, мемы)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="topicTags">Теги (через запятую)</label>
        <input class="input" type="text" id="topicTags" placeholder="#E50M #Референс #Гайд" data-draft-field="tags">
      </div>

      <div class="form-group">
        <label for="topicBody">Содержание</label>
        <textarea class="input" id="topicBody" rows="8" placeholder="Опиши свою мысль, приложи реплей или скриншоты..." style="resize:vertical" data-draft-field="body"></textarea>
      </div>

      <div class="form-group">
        <label>Вложения</label>
        <div style="border:2px dashed var(--border-color);border-radius:var(--radius-md);padding:2rem;text-align:center;cursor:pointer;transition:0.2s" onclick="toast.show('Выбор файлов откроется в полной версии')">
          <p style="font-size:2rem;margin-bottom:0.5rem">📎</p>
          <p class="text-sm text-tertiary">Перетащи файлы сюда или нажми для выбора</p>
          <p class="text-xs text-tertiary">Изображения до 10 МБ · Реплеи (.wotreplay) до 15 МБ</p>
        </div>
      </div>

      <div class="form-group">
        <label class="form-checkbox">
          <input type="checkbox"> Отправить в «Склад нытья» (анонимно)
        </label>
      </div>

      <div class="flex gap-2" style="margin-top:1.5rem;flex-wrap:wrap">
        <button type="submit" class="btn btn-fire" style="padding:0.7rem 2rem;font-size:1rem">⬡ Опубликовать тему</button>
        <button type="button" class="btn btn-ghost" onclick="document.querySelector('[data-draft]').dispatchEvent(new Event('submit'))">💾 Сохранить черновик</button>
        <button type="button" class="btn btn-ghost" onclick="window.location.href='feed.html'" style="margin-left:auto">Отмена</button>
      </div>

      <div class="auto-save-indicator" data-draft-indicator style="margin-top:0.75rem">💾 Черновик сохраняется автоматически</div>
    </form>

  </main>
</div>

<div id="footerPlaceholder"></div>
<div id="chatPlaceholder"></div>

<script src="js/utils.js"></script>
<script src="js/theme.js"></script>
<script src="js/toast.js"></script>
<script src="js/avatar.js"></script>
<script src="js/components.js"></script>
<script src="js/chat.js"></script>
<script src="js/drafts.js"></script>
</body>
</html>
