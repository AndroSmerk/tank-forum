function ua(u) {
  return 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Crect fill=\''+u.svg+'\' width=\'100\' height=\'100\'/%3E%3Ccircle fill=\''+u.svg2+'\' cx=\'50\' cy=\'35\' r=\'22\'/%3E%3Ctext x=\'50\' y=\'42\' text-anchor=\'middle\' font-size=\'12\' fill=\'%232b2d1f\' font-weight=\'bold\'%3E'+u.lbl+'%3C/text%3E%3C/svg%3E';
}

function medals(u) {
  if (!u.m) return '';
  var map = { gold:'medal-gold', silver:'medal-silver', fire:'medal-fire' };
  return '<div class="medal-strip" style="justify-content:center;margin-top:0.3rem">' +
    u.m.split(',').map(function(c){return '<span class="medal '+map[c]+'">'+(c==='fire'?'♥':'★')+'</span>';}).join('')+'</div>';
}

function postSidebar(u, isMe, isVent) {
  var border = isVent ? 'var(--fire-400)' : 'var(--border-color)';
  return '<div class="post-sidebar">' +
    '<div class="avatar-wrap" style="margin:0 auto">' +
    '<img class="avatar avatar-lg"'+(isMe?' data-avatar="me"':'')+' src="'+ua(u)+'" alt="'+u.n+'">' +
    '<span class="online-dot'+(u===USERS.ryadovoy?' offline':'')+'"></span></div>' +
    '<span class="username">'+u.n+'</span>' +
    '<span class="rank-badge '+u.rc+'" style="border-color:'+border+'">'+u.r+'</span></div>';
}

function postBody(text, time, num, up, down, resp, isVent) {
  var r = '<div class="post-body">' +
    '<div class="post-header"><span>🕒 '+time+' · №'+num+'</span></div><div class="post-text">'+text+'</div>';
  return r + '</div>';
}

function post(u, text, time, num, up, down, resp, isVent, isMe) {
  var border = isVent ? '1px dashed var(--fire-400);background:linear-gradient(135deg,var(--bg-card),rgba(180,60,40,0.03))' : 'border-left:3px solid var(--steel-300)';
  return '<div class="post" style="'+border+'">'+postSidebar(u, isMe, isVent)+postBody(text,time,num,up,down,resp,isVent)+'</div>';
}

var TOPICS = {
  1: { cat:'Ламповая броня', t:'📌 Правила подразделения: как не получить штрафбат', author: 'komandir', tg:['ЗАКРЕП'], tgc:['tag-gold'], au:'Командир', au2:'23 мар 2026', posts:[
    ['komandir','<p>Добро пожаловать в подразделение, бойцы! Напоминаем основные правила:</p><p>1. Не оскорблять личный состав.<br>2. Не флудить в тематических разделах.<br>3. Реплеи только в Тактический полигон.<br>4. В Складе нытья — никакого троллинга, только поддержка.<br>5. За нарушения — штрафбат от 30 мин до 24 ч.</p><p>Соблюдайте устав, и бой будет в радость! ⬡</p>','сегодня, 12:00',1,47,3,128,false,true],
    ['polkovnik','<blockquote><strong>Командир</strong> писал(а):<br>4. В Складе нытья — никакого троллинга</blockquote><p>Принято, командир! Отличный раздел, многим помогает.</p>','сегодня, 12:45',2,12,1,18,false,false],
    ['tankist','<p>Правила чёткие, респект. Надо бы ещё добавить правило про рекламу — а то развелось «ускорителей».</p>','сегодня, 13:10',3,8,0,22,false,false],

  2: { cat:'Ламповая броня', t:'Патч 1.26 — кто чего накопил? Впечатления за неделю', author: 'tankist', tg:['ХОТОВО','#ПАТЧ'], tgc:['tag-fire',''], au:'Tankist_1979', au2:'2 дня назад', posts:[
    ['tankist','<p>Мужики, прошла неделя с патча 1.26. Что думаете? Я за неделю накопил 850к свободки, думаю — вкачивать новую ветку или подождать?</p><p>Лично мне нравится ребаланс ПТ, стало интереснее играть.</p>','2 дня назад',1,18,2,34,false,true],
    ['serg','<p>Я за неделю 1.2М свободки насобирал на аккаунте с премом. Вкачиваю Object 268/4 — говорят, имба после патча. Кто уже взял?</p>','2 дня назад',2,12,1,27,false,false],
    ['vova','<p>А мне патч зашёл. KV-2 бафать не стали, ну и ладно, я и так на нём 62% винрейта держу 💪😄</p>','вчера, 09:15',3,8,0,12,false,false],
    ['polkovnik','<p>Ребаланс карт — вот что важно. Прохоровку подправили, теперь centre camp — не вариант. Надо работать флангами.</p><p>Кстати, выложил реплей в полигон — гляньте.</p>','вчера, 14:30',4,24,3,47,false,false],
  ]},
  3: { cat:'Ламповая броня', t:'На чём фармить серебро в 2026? Топ-5 машин для доната', author: 'serega', tg:['ГАЙД','#ФАРМ'], tgc:['tag-steel',''], au:'Serega_Na_Objekte', au2:'5 часов назад', posts:[
    ['serega','<p>Ребята, всем привет! За неделю протестил 10 машин на фарм. Держите топ-5:</p><p><strong>1. Object 252U (Defender)</strong> — классика, броня держит, урон 440.<br><strong>2. E 50 M</strong> — если руки прямые, фармит космос.<br><strong>3. M54 Renegade</strong> — ДПМ зверь, но броня картон.<br><strong>4. LT-432</strong> — лучший ЛТ для фарма.<br><strong>5. Progetto 46</strong> — механика дозарядки имба.</p><p>Кто что добавит?</p>','5 часов назад',1,34,2,67,false,true],
    ['polkovnik','<p>Progetto 46 — да, машинка огонь. Но E 50 M если умеешь играть от брони башни — фармит стабильно 80-100к за бой.</p>','4 часа назад',2,15,0,24,false,false],
    ['tankist','<p>Ещё TS-5 забыл! ПТ-шку за 30 баксов — броня лобовая космос, ДПМ 3000. Для фарма идеал.</p>','3 часа назад',3,11,2,19,false,false],
  ]},
  4: { cat:'Ламповая броня', t:'Maus в 2026 — всё ещё стенка или уже бесполезен?', author: 'maus', tg:['#ТЯЖИ'], tgc:[''], au:'Maus_22', au2:'вчера, 19:42', posts:[
    ['maus','<p>Народ, два года не играл, вернулся — а Maus уже не катит? Раньше я на нём танковал как бетонная стена, а сейчас пробивают везде голдой.</p><p>Стоит ли его сейчас вывозить или только фармить на другом?</p>','вчера, 19:42',1,22,4,41,false,true],
    ['serg','<p>Maus норм, но ситуативно. На городских картах — да, стена. На открытых — страдает. Голда сейчас у всех, так что чистого танкования броней уже не сделать.</p><p>Совет: играй от ХП и орудия, а не от брони.</p>','вчера, 21:05',2,9,1,15,false,false],
    ['polkovnik','<p>E 100 сейчас интереснее, честно. 750 альфы, броня норм. Но Маус — это легенда, катай если кайфуешь.</p>','вчера, 22:30',3,14,0,28,false,false],
  ]},
  5: { cat:'Ламповая броня', t:'Как настроить прицел под себя: моды, конфиги, фишки', author: 'polkovnik', tg:['ГАЙД','#МОДЫ'], tgc:['tag-steel',''], au:'Полковник_Медведь', au2:'3 дня назад', posts:[
    ['polkovnik','<p>За 10 лет в игре перепробовал кучу прицелов. Держите лучшие настройки:</p><p><strong>1. Deegie\'s Scope Mod</strong> — лучший для ПТ и СТ.<br><strong>2. MeltyMap\'s MathMod</strong> — продвинутый прицел с калькулятором.<br><strong>3. Server crosshair</strong> — включите в настройках, must have.</p><p>Главное — уберите лишнюю анимацию, она отвлекает.</p><p>Кто каким прицелом пользуется?</p>','3 дня назад',1,28,1,112,false,true],
    ['serega','<p>Пользуюсь стандартным с серверным маркером. Без модов как-то привык. Но многие хвалят Deegie\'s — надо попробовать.</p>','2 дня назад',2,7,0,11,false,false],
    ['tankist','<p>А я вообще на ваниле играю. Всё лишнее отключил, только серверный прицел и минималку. Так больше погружение.</p>','2 дня назад',3,13,2,22,false,false],
  ]},
  6: { cat:'Ламповая броня', t:'Что смотрите на стримах? Кого из танковых блогеров уважаете?', author: 'serg', tg:['ХОТОВО','#МЕДИА'], tgc:['tag-fire',''], au:'Serg_76', au2:'4 дня назад', posts:[
    ['serg','<p>Мужики, вечерами после работы люблю стримы потанчить. Кого смотрите?</p><p>Я залипаю на:\n- Amway921 — спокойный без криков\n- The_Mogol — годные разборы\n- LeBwa — когда поржать</p>','4 дня назад',1,73,5,156,false,true],
    ['tankist','<p>Amway — уважаю, мужик реально шарит. Ещё Strelec нравится — без воды всё по делу.</p>','3 дня назад',2,18,1,32,false,false],
    ['vova','<p>А я Jove смотрю. Да, старый, но ламповый. Под пиво вечером — самое то 🍻</p>','3 дня назад',3,24,3,41,false,false],
    ['polkovnik','<p>Mogol — лучший по разборам реплеев. Гайды конкретные, без воды. Рекомендую всем, кто хочет расти в скилле.</p>','вчера, 11:45',4,31,0,67,false,false],
  ]},
  7: { cat:'Тактический полигон', t:'🎯 Разбор реплея: 8 убийств на Prokhorovka в E 50 M', author: 'polkovnik', tg:['РЕПЛЕЙ','#ПРОХОРОВКА','#ГАЙД'], tgc:['tag-gold','','tag-steel'], au:'Полковник_Медведь', au2:'сегодня, 14:23', posts:[
    ['polkovnik','<p>Мужики, всем салют! Разобрал сегодня реплей с Прохоровки. Основная ошибка новичков — лезут в центр на тяжах.</p><p>На E 50 M нужно работать от борта, использовать динамику.</p><p>Кинул реплей во вложения — гляньте. Кто как заезжает на этой карте?</p>','сегодня, 14:23',1,24,3,47,false,true],
    ['serg','<blockquote><strong>Полковник_Медведь</strong> писал(а):<br>На E 50 M нужно работать от борта, использовать динамику.</blockquote><p>Согласен! Я на E 50 M уже 600 боёв. Добавлю: не забывайте про бронирование башни — можно танковать очень хорошо!</p>','сегодня, 15:07',2,12,1,18,false,false],
    ['vova','<p style="font-size:1.6rem">🦊 🐮 🐻 🐴</p><p>— держите стикеры, мужики! 🔥</p>','сегодня, 15:23',3,8,0,12,false,false],

  8: { cat:'Тактический полигон', t:'Карта Руинберг: тактика за три стороны — полный разбор', author: 'wotforev', tg:['ГАЙД','#РУИНБЕРГ'], tgc:['tag-steel',''], au:'WoT_forever', au2:'вчера, 11:20', posts:[
    ['wotforev','<p>Руинберг — карта, где выигрывает тот, кто контролирует центр. Разберём за каждую сторону:</p><p><strong>Верхний респ:</strong> сразу занимайте холмы слева, оттуда контроль центра.<br><strong>Нижний респ:</strong> работайте через город, не лезьте в поле.<br><strong>Респ справа:</strong> на СТ и ЛТ — проход через железку.</p><p>Главное — не стоять в кустах весь бой!</p>','вчера, 11:20',1,18,2,74,false,true],
    ['serega','<p>Хороший гайд! Добавлю: на тяжах в городе работайте от углов, не выкатывайтесь под нескольких сразу.</p><p>А на ПТ — позиции за домами в центре, там отличный прострел.</p>','вчера, 13:45',2,9,0,14,false,false],
  ]},
  9: { cat:'Тактический полигон', t:'ЛТ-свет на Малиновке: маршруты, кусты, засвет', author: 'is7fan', tg:['#ЛЁГКИЕ','#МАЛИНОВКА'], tgc:['',''], au:'IS7_fan', au2:'2 дня назад', posts:[
    ['is7fan','<p>Ребята, подскажите маршруты на Малиновке для ЛТ. Играю на ELC Even 90, вроде кусты знаю, но засвечивают часто.</p><p>Может кто схемы скинет?</p>','2 дня назад',1,14,3,28,false,true],
    ['wotforev','<p>Главное правило Малиновки — не светись в первой фазе. Заезжай в кусты 1-й линии, жди 1-2 минуты.</p><p>На ELC: куст F6 простреливает весь центр. Потом переезд в E0 — засвет базы.</p>','2 дня назад',2,11,0,19,false,false],
    ['polkovnik','<p>ELC Even 90 — имба для Малиновки. Маскировка 50%+ с сетью. Совет: поставь доппайку и вентиляцию, крутись вокруг кустов не выходя из засвета.</p>','1 день назад',3,17,1,32,false,false],
  ]},
  10: { cat:'Тактический полигон', t:'Объект 140 vs Т-62А: какой СТ брать в 2026?', author: 'tankist', tg:['ГАЙД','#СТ'], tgc:['tag-steel',''], au:'Tankist_1979', au2:'5 дней назад', posts:[
    ['tankist','<p>Встал выбор: качать Об.140 или Т-62А? Оба вроде похожи, но что лучше в текущей мете?</p><p>У кого какой опыт?</p>','5 дней назад',1,20,2,42,false,true],
    ['polkovnik','<p>Об.140 сейчас сильнее. Углы склонения лучше, броня башни держит, ДПМ выше. Т-62А больше для коллекции.</p><p>Но если нравится классика — Т-62А тоже норм, просто сложнее.</p>','4 дня назад',2,15,0,28,false,false],
    ['serega','<p>Об.140 топ. Но я бы советовал сразу смотреть на K-91 — он интереснее в нынешней мете.</p>','4 дня назад',3,7,4,11,false,false],
  ]},
  11: { cat:'Тактический полигон', t:'Слил 15 боёв подряд на тяжах — где я свернул не туда?', author: 'ryadovoy', tg:['#ПОМОЩЬ'], tgc:[''], au:'Рядовой_Петров', au2:'6 часов назад', posts:[
    ['ryadovoy','<p>Товарищи, выручайте. Уже 15 боёв слил подряд на IS-7. Раньше норм играл, а сейчас просто кусок мяса.</p><p>Поменялось что-то в патче? Или я разучился?</p>','6 часов назад',1,9,4,15,false,true],
    ['polkovnik','<p>IS-7 сейчас — ситуационная машина. На городских картах заходи в первые линии, работай от башни. На открытых — не лезь, жди пока команда соберётся.</p><p>Скинь реплей пары боёв — гляну.</p>','5 часов назад',2,11,0,22,false,false],
    ['tankist','<p>Бывает, бро. У меня тоже бывают серии по 10 сливов. Отдохни денёк, перезагрузи голову. И попробуй на СТ переключиться — помогает.</p>','3 часа назад',3,7,0,13,false,false],
    ['serg','<p>Главное — не беситься. Начинаешь психовать — играешь хуже. Сделай перерыв на 30 минут, выйди покурить/попить чай.</p><p>И проверь оборудование — может сетевая лагает.</p>','30 мин назад',4,10,0,17,false,false],
  ]},
  12: { cat:'Склад нытья', t:'Сил нет… Работа, жена, ипотека. Есть тут кто в танке?', isVent:true, author: 'ryadovoy', tg:['НЫТЬЁ','#ЖИЗНЬ','#ПОДДЕРЖКА'], tgc:['tag-fire','',''], au:'Рядовой_Петров', au2:'сегодня, 03:14', posts:[
    ['ryadovoy','<p>Мужики, привет. Сижу в три ночи, не спится.</p><p>Работа — полная ***, жена пилит, ипотека до 50 лет. Единственное, что держит на плаву — вечерний взвод в WoT после того, как все уснули.</p><p>Есть тут кто в похожей ситуации? Как справляетесь?</p><p style="margin-top:0.5rem;font-style:italic;color:var(--text-tertiary)">p.s. Прошу без троллинга, ребят. Просто выговориться надо.</p>','сегодня, 03:14',1,23,0,0,true,true],
    ['tankist','<p>Держись, братан! У многих так. Я в 36 лет сменил работу — стало легче. Главное — не замыкаться в себе. Танки — это наш способ перезагрузки.</p><p>Если нужен взвод — стучи, всегда готов подъехать. 💪</p>','сегодня, 06:15',2,12,0,0,true,false],

function ensureProfile() {
  var raw = localStorage.getItem('tank-profile');
  if (!raw) {
    var def = {
      name: 'Полковник_Медведь',
      rank: '★★★ Полковник',
      rankClass: 'rank-colonel',
      rankLabel: 'Полковник',
      quote: 'Броня крепка и танки наши быстры!',
      profession: 'Менеджер по продажам',
      city: 'Москва',
      tank: 'E 50 M'
    };
    localStorage.setItem('tank-profile', JSON.stringify(def));
    raw = localStorage.getItem('tank-profile');
  }
  var profile = JSON.parse(raw);
  USERS.me.n = profile.name;
  USERS.me.r = profile.rank;
  USERS.me.rc = profile.rankClass;
  return profile;
}

function handleReply(form) {
  var textarea = form.querySelector('[data-draft-field]');
  var text = textarea.value.trim();
  if (!text) return;
  var p = new URLSearchParams(window.location.search);
  var id = p.get('id') || '1';
  var t = TOPICS[id];
  if (!t) return;
  ensureProfile();
  var nextNum = t.posts.length + 1;
  t.posts.push(['me', '<p>' + escapeHtml(text) + '</p>', 'только что', nextNum, 0, 0, 0]);
  textarea.value = '';
  localStorage.removeItem('tank-draft-reply-' + (t.isVent ? 'vent-' : '') + id);
  renderTopic();
}

function renderTopic() {
  var p = new URLSearchParams(window.location.search);
  var id = p.get('id') || '1';
  var isVent = p.has('type');
  var t = TOPICS[id];
  if (!t) { document.getElementById('topicContent').innerHTML = '<p>Тема не найдена. <a href="feed.html">← Назад</a></p>'; return; }
  ensureProfile();

  var h = '<div class="breadcrumbs"><a href="feed.html">Форум</a> <span>/</span> <a href="feed.html">'+t.cat+'</a> <span>/</span> <span>'+t.t.replace(/^[^\s]+\s/,'').substring(0,40)+'…</span></div>';
  h += '<h1 style="font-size:1.35rem;font-weight:800;margin-bottom:0.5rem'+(isVent?';color:var(--fire-500)':'')+'">'+t.t+'</h1>';

  h += '<div class="flex items-center gap-2" style="margin-bottom:1rem;flex-wrap:wrap">';
  for (var i=0;i<t.tg.length;i++) {
    h += '<span class="tag'+(t.tgc[i]?' '+t.tgc[i]:'')+'">'+t.tg[i]+'</span>';
  }
  h += '<span class="text-sm text-tertiary">Автор: <strong>'+t.au+'</strong> • '+t.au2+'</span>';
  h += '<a href="feed.html" class="btn btn-ghost btn-sm" style="margin-left:auto">← К списку</a></div>';

  for (var pi=0;pi<t.posts.length;pi++) {
    var po = t.posts[pi];
    var u = USERS[po[0]];
    if (!u) continue;
    h += post(u, po[1], po[2], po[3], po[4], po[5], po[6], isVent, po[0] === 'me');
  }

  if (t.posts.length > 5) {
    h += '<div class="pagination" style="margin-top:0.5rem"><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">⋯</button><button class="page-btn">'+(Math.ceil(t.posts.length/5)+1)+'</button></div>';
  }

  if (isVent) {
    h += '<div class="reply-form" style="border-color:var(--fire-400)">' +
      '<h3 style="font-size:1rem;margin-bottom:0.75rem;color:var(--fire-500)">💬 Поддержать бойца</h3>' +
      '<form data-draft="reply-vent-'+id+'" onsubmit="handleReply(this);return false">' +
      '<textarea placeholder="Напиши слова поддержки... Без троллинга, пожалуйста" data-draft-field="text"></textarea>' +
      '<div class="flex items-center justify-between" style="margin-top:0.5rem;flex-wrap:wrap;gap:0.5rem">' +
      '<button class="btn btn-ghost btn-sm" type="button">😊 Стикер</button>' +
      '<button class="btn btn-primary" type="submit" style="background:var(--fire-500)">💬 Поддержать</button></div>' +
      '<div class="auto-save-indicator" data-draft-indicator></div></form></div>';
  } else {
    h += '<div class="reply-form">' +
      '<h3 style="font-size:1rem;margin-bottom:0.75rem">✏ Написать ответ</h3>' +
      '<form data-draft="reply-'+id+'" onsubmit="handleReply(this);return false">' +
      '<textarea placeholder="Напиши своё мнение, братан..." data-draft-field="text"></textarea>' +
      '<div class="flex items-center justify-between" style="margin-top:0.5rem;flex-wrap:wrap;gap:0.5rem">' +
      '<div class="flex gap-2 items-center"><button class="btn btn-ghost btn-sm" type="button">📎 Вложение</button>' +
      '<button class="btn btn-ghost btn-sm" type="button">😊 Стикер</button></div>' +
      '<button class="btn btn-primary" type="submit">➡ Отправить</button></div>' +
      '<div class="auto-save-indicator" data-draft-indicator>💾 Черновик сохраняется автоматически</div></form></div>';
  }

  document.getElementById('topicContent').innerHTML = h;
  if (window.draftsInit) window.draftsInit();
}

document.addEventListener('DOMContentLoaded', renderTopic);
